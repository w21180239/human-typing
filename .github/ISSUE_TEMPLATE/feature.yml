name: Feature request
description: A new span rule, timing behaviour, backend or CLI option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The typing workflow where humantype falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like it to do. A concrete example text (and which parts should be pasted or typed) helps most.
    validations:
      required: true
