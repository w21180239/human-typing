name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Refuse a ref that is not a version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::ref ${GITHUB_REF_NAME} is not a vX.Y.Z tag"
            exit 1
          fi

      - name: Check the tag matches package.json and plugin.json
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r .version package.json)
          plugin=$(jq -r .version plugins/human-typing/.claude-plugin/plugin.json)
          if [[ "$want" != "$pkg" || "$want" != "$plugin" ]]; then
            echo "::error::tag $want, package.json $pkg and plugin.json $plugin must all match"
            exit 1
          fi

      - name: Run the tests
        run: npm test

      - name: Extract the release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' docs/en/CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::no section for $version in docs/en/CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::notice::NPM_TOKEN is empty, skipping npm publish"
            exit 0
          fi
          npm publish --provenance --access public
